spring:
  application:
    name: LaborLens
  config:
    # Import the untracked local database configuration as a properties file.
    import: optional:file:.env[.properties]
    
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # Use migration credentials from env.txt, falling back to the application account.
    url: ${flyway.url:${DB_URL}}
    user: ${flyway.user:${DB_USERNAME}}
    password: ${flyway.password:${DB_PASSWORD}}
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: true

  jwt:
    secret: ${JWT_SECRET_KEY}
    accessTokenExpiration: 1800 # 0.5h
    refreshTokenExpiration: 604800 # 7 d

app:
  data:
    # Relative paths resolve from the process working directory, normally backend/.
    root: ${DATA_DIR:../data}
