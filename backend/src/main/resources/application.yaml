spring:
  application:
    name: LaborLens
  config:
    # Import the untracked local database configuration as a properties file.
    import: optional:file:.env[.properties]
    
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # Use migration credentials from env.txt, falling back to the application account.
    url: ${flyway.url:${DB_URL}}
    user: ${flyway.user:${DB_USERNAME}}
    password: ${flyway.password:${DB_PASSWORD}}
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    # Authentication and account mutations must read fresh transaction state.
    open-in-view: false


app:
  auth:
    jwt-secret: ${JWT_SECRET_KEY}
    issuer: laborlens
    access-seconds: 1800
    refresh-seconds: 604800
    # Use false only for local HTTP development; production cookies must be Secure.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  data:
    # Relative paths resolve from the process working directory, normally backend/.
    root: ${DATA_DIR:../data}
